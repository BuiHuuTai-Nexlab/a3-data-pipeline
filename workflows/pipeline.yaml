# Chay ca pipeline: bronze -> silver (3 job tuan tu, quota CPU khong du de chay song song) -> gold (6 file SQL theo thu tu FK).
main:
  steps:
    - init:
        assign:
          - run_id: ${string(int(sys.now()))}
          - gold_tables:
              - dim_province
              - dim_ward
              - dim_category
              - dim_phone
              - dim_address
              - dim_merchant

    - bronze:
        call: run_batch
        args:
          name: ingest-merchant
          script: src/bronze/ingest_merchant.py
          run_id: ${run_id}

    - silver:
        for:
          value: job
          in: [province, ward, merchant]
          steps:
            - run_silver:
                call: run_batch
                args:
                  name: ${"silver-" + job}
                  script: ${"src/silver/transform_" + job + ".py"}
                  run_id: ${run_id}

    - gold:
        for:
          value: table
          in: ${gold_tables}
          steps:
            - run_gold_sql:
                call: run_sql_file
                args:
                  path: ${"sql/gold/" + table + ".sql"}

    - done:
        return: ${"pipeline " + run_id + " finished"}


# Chay 1 Dataproc Serverless batch va cho den khi xong; batch loi thi workflow loi.
# (Workflows khong co connector cho batches nen goi REST API roi poll trang thai.)
run_batch:
  params: [name, script, run_id]
  steps:
    - init:
        assign:
          - batch_id: ${name + "-" + run_id}
          - bucket: gs://a3-data-pipeline-code
          - batches_url: ${"https://dataproc.googleapis.com/v1/projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/locations/asia-southeast1/batches"}
    - submit:
        call: http.post
        args:
          url: ${batches_url}
          query:
            batchId: ${batch_id}
          auth:
            type: OAuth2
          body:
            pysparkBatch:
              mainPythonFileUri: ${bucket + "/" + script}
              pythonFileUris:
                - ${bucket + "/utils.zip"}
            environmentConfig:
              executionConfig:
                serviceAccount: ingest-bronze-sa@a3-retail-dwh-project.iam.gserviceaccount.com
    - wait:
        call: sys.sleep
        args:
          seconds: 30
    - get_state:
        call: http.get
        args:
          url: ${batches_url + "/" + batch_id}
          auth:
            type: OAuth2
        result: batch
    - check_state:
        switch:
          - condition: ${batch.body.state == "SUCCEEDED"}
            return: ${batch_id}
          - condition: ${batch.body.state in ["FAILED", "CANCELLED", "CANCELLING"]}
            raise: ${"batch " + batch_id + " ended with state " + batch.body.state}
        next: wait


# Doc 1 file SQL tu GCS (CD dong bo sql/gold len bucket) roi chay tren BigQuery.
run_sql_file:
  params: [path]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
    - read_sql:
        call: http.get
        args:
          url: ${"https://storage.googleapis.com/storage/v1/b/a3-data-pipeline-code/o/" + text.url_encode(path)}
          query:
            alt: media
          auth:
            type: OAuth2
        result: file
    - run_query:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            configuration:
              query:
                query: ${text.decode(file.body)}
                useLegacySql: false
            jobReference:
              location: asia-southeast1
